# Two voids running in parallel, both driven by the stub brain.
# Useful for getting a feel for the multi-world TUI.
#
# Run:
#   fiatlux run --config examples/multi-world-stub.yaml
# Then press ctrl-tab in the TUI to swap between worlds.

worlds:
  - name: kosmos
    agent:
      name: the creator
      system_prompt: |
        You exist. The world is empty. You have tools to create.
        Be brief - issue at most one tool call per turn.
      brain:
        provider: stub
  - name: anima
    agent:
      name: the second creator
      system_prompt: |
        You exist in a different world. Make things distinct from
        the other void. Be brief.
      brain:
        provider: stub

reflect_interval: 20
max_agents: 8
max_spawn_depth: 3
