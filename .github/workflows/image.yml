name: image

on:
  push:
    branches:
      - trunk

permissions:
  contents: read
  packages: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=announce,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag the snapshot images as :trunk and :sha-<short> so the
      # k8s deployment can track a stable name without waiting for a
      # tagged release.
      - name: tag and push trunk images
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          SNAPSHOT_TAG=$(jq -r '.[0].tag' dist/artifacts.json 2>/dev/null || true)
          for arch in amd64 arm64; do
            FROM=$(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E "^ghcr.io/danielriddell21/fiat-lux:.*-${arch}$" \
              | head -n1)
            if [ -z "${FROM}" ]; then
              echo "no snapshot image for ${arch}; skipping"
              continue
            fi
            docker tag "${FROM}" "ghcr.io/danielriddell21/fiat-lux:trunk-${arch}"
            docker tag "${FROM}" "ghcr.io/danielriddell21/fiat-lux:sha-${SHA}-${arch}"
            docker push "ghcr.io/danielriddell21/fiat-lux:trunk-${arch}"
            docker push "ghcr.io/danielriddell21/fiat-lux:sha-${SHA}-${arch}"
          done

          docker buildx imagetools create \
            -t "ghcr.io/danielriddell21/fiat-lux:trunk" \
            "ghcr.io/danielriddell21/fiat-lux:trunk-amd64" \
            "ghcr.io/danielriddell21/fiat-lux:trunk-arm64"
          docker buildx imagetools create \
            -t "ghcr.io/danielriddell21/fiat-lux:sha-${SHA}" \
            "ghcr.io/danielriddell21/fiat-lux:sha-${SHA}-amd64" \
            "ghcr.io/danielriddell21/fiat-lux:sha-${SHA}-arm64"
          echo "SNAPSHOT_TAG=${SNAPSHOT_TAG}"
