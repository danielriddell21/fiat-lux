name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: letsgo
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: 0. letsgo falls back to the GitHub compare API when the
      # changelog needs history a shallow clone does not have.
      - uses: actions/checkout@v7

      # The Go version changes the bytes of the binaries, so it is pinned by
      # go.mod rather than floating on `stable`.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # letsgo publishes the release, the tap formula and the ghcr.io image with
      # one token, and a workflow token cannot write to another repository at
      # all. The App token therefore has to be scoped to this repository as well
      # as the tap, and the App needs package write for the image push.
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            homebrew-tap

      # No docker/login-action, QEMU or Buildx: letsgo assembles the multi-arch
      # image from the binaries it just built and pushes it over the registry
      # API, so there is no daemon to authenticate.
      - uses: danielriddell21/letsgo-action@v1
        with:
          token: ${{ steps.token.outputs.token }}
