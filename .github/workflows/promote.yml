name: Promote Release

on:
  release:
    types: [released]

jobs:
  update-manifests:
    name: Pin version in riddellious-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: danielriddell21/riddellious-dev
          ref: trunk
          token: ${{ secrets.RIDDELLIOUS_DEV_TOKEN }}

      - name: Update image tag in deployments
        run: |
          VERSION=${{ github.event.release.tag_name }}
          find . -name "deployment.yaml" \
            -exec sed -i "s|ghcr.io/danielriddell21/fiat-lux:.*|ghcr.io/danielriddell21/fiat-lux:${VERSION}|g" {} \;

      - name: Commit and push
        run: |
          VERSION=${{ github.event.release.tag_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/
          git diff --staged --quiet || git commit -m "chore: deploy fiat-lux ${VERSION}"
          git push
